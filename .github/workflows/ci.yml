name: CI

on:
  push:
  pull_request:

jobs:
  firmware-contracts:
    name: Firmware contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Validate shared C++ headers
        run: |
          g++ -std=c++17 -Ifirmware-contracts/include -Wall -Wextra -Werror \
            firmware-contracts/test/check_note_event.cpp -o /tmp/check_note_event
          g++ -std=c++17 -Ifirmware-contracts/include -Wall -Wextra -Werror \
            firmware-contracts/test/check_instrument_event_sink.cpp -o /tmp/check_instrument_event_sink

          /tmp/check_note_event
          /tmp/check_instrument_event_sink

      - name: Validate PlatformIO library package
        run: pio pkg pack . --output /tmp

  showcases:
    name: Showcase ${{ matrix.showcase_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - showcase_id: 1
            showcase_path: showcases/ble-midi-buzzer
          - showcase_id: 2
            showcase_path: showcases/ble-midi-core-gray-speaker
          - showcase_id: 3
            showcase_path: showcases/ble-midi-amy

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-${{ runner.os }}-${{ hashFiles('showcases/**/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build showcase firmware
        run: env PLATFORMIO_CORE_DIR="${{ github.workspace }}/.platformio-home" pio run -d "${{ matrix.showcase_path }}"

      - name: Inspect Showcase 3 linked memory
        if: matrix.showcase_id == 3
        run: |
          build_dir="${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray"
          python scripts/elf-memory-report.py \
            "$build_dir/firmware.elf" \
            --markdown "$build_dir/memory-report.md" \
            --json "$build_dir/memory-report.json"
          cat "$build_dir/memory-report.md" >> "$GITHUB_STEP_SUMMARY"
          test -f "$build_dir/firmware.map"

      - name: Probe NimBLE host code in flash
        if: matrix.showcase_id == 3
        run: |
          env PLATFORMIO_CORE_DIR="${{ github.workspace }}/.platformio-home" \
            pio run -d "${{ matrix.showcase_path }}" \
            -e m5stack-core-gray-nimble-flash-probe

          baseline_dir="${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray"
          probe_dir="${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray-nimble-flash-probe"
          python scripts/elf-memory-report.py \
            "$probe_dir/firmware.elf" \
            --markdown "$probe_dir/memory-report.md" \
            --json "$probe_dir/memory-report.json"

          python - "$baseline_dir/memory-report.json" "$probe_dir/memory-report.json" <<'PY'
          import json
          import sys

          baseline = json.load(open(sys.argv[1]))["iram_used_bytes"]
          probe = json.load(open(sys.argv[2]))["iram_used_bytes"]
          delta = baseline - probe
          with open("nimble-flash-comparison.md", "w") as output:
              output.write("## NimBLE host-in-Flash probe\n\n")
              output.write("| Configuration | IRAM used | Change vs baseline |\n")
              output.write("|---|---:|---:|\n")
              output.write(f"| Published Showcase 3 | {baseline:,} bytes | — |\n")
              output.write(
                  f"| `CONFIG_BT_NIMBLE_LOW_SPEED_MODE=1` | {probe:,} bytes | "
                  f"{delta:+,} bytes freed |\n\n"
              )
              if delta == 0:
                  output.write(
                      "The project-level define did not change linked IRAM; the "
                      "Arduino framework/toolchain did not apply this ESP-IDF "
                      "placement option to the linked components.\n"
                  )
          PY
          cat nimble-flash-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Showcase 3 memory evidence
        if: matrix.showcase_id == 3
        uses: actions/upload-artifact@v4
        with:
          name: showcase-3-memory-${{ github.sha }}
          path: |
            ${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray/firmware.elf
            ${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray/firmware.map
            ${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray/memory-report.md
            ${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray/memory-report.json
            ${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray-nimble-flash-probe/firmware.elf
            ${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray-nimble-flash-probe/firmware.map
            ${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray-nimble-flash-probe/memory-report.md
            ${{ matrix.showcase_path }}/.pio/build/m5stack-core-gray-nimble-flash-probe/memory-report.json
            nimble-flash-comparison.md
          if-no-files-found: error
          retention-days: 30
