[platformio]
core_dir = ../../../.platformio-home
default_envs = m5stack-core-gray

[env:m5stack-core-gray]
platform = platformio/espressif32@7.0.1
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = huge_app.csv
build_flags =
  -pipe
  -D BLE_MIDI_DEVICE_NAME='"M5 Gray Speaker"'
lib_deps =
  ble-midi-input=https://github.com/fczuardi/midi-receiver.git#a58c1119
  monophonic-instrument=file://../../.tmp/monophonic-instrument-0.1.1.tar.gz
  m5-tone-output=file://../../.tmp/m5-tone-output-0.1.2.tar.gz
  m5stack/M5Unified@0.2.17
lib_ignore =
  ArduinoBLE
  Arduino_SpiNINA
  NimBLE-Arduino
