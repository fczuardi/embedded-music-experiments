[platformio]
core_dir = ../../../.platformio-home
default_envs = m5stick-cplus2

[env:m5stick-cplus2]
platform = platformio/espressif32@7.0.1
board = m5stick-cplus2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -pipe
lib_deps =
  BleMidiInput=https://github.com/fczuardi/midi-receiver.git#c22fc019521d
  monophonic-instrument=file:///home/fcz/dev/m5stick/.tmp/monophonic-instrument-0.1.1.tar.gz
  m5-tone-output=file:///home/fcz/dev/m5stick/.tmp/m5-tone-output-0.1.1.tar.gz
