[platformio]
core_dir = ../../../.platformio-home
default_envs = m5stick-cplus2

[env:m5stick-cplus2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stick-cplus2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.variant = m5stack_stickc_plus2
build_flags =
  -pipe
  -D BLE_MIDI_DEVICE_NAME='"M5 Plus2 Buzzer"'
lib_deps =
  ble-midi-input=https://github.com/fczuardi/midi-receiver.git#c40e71bf
  fcz2/monophonic-instrument@0.1.2
  fcz2/m5-tone-output@0.1.2
  m5stack/M5Unified@0.2.17
lib_ignore =
  ArduinoBLE
  Arduino_SpiNINA
