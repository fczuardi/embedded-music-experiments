[platformio]
core_dir = ../../../.platformio-home
default_envs = m5stick-cplus2

[env:m5stick-cplus2]
platform = platformio/espressif32@7.0.1
board = m5stick-cplus2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -pipe
lib_deps =
  EmbeddedMusicBleMidiInput=https://github.com/fczuardi/midi-receiver.git#60fce82734d3a81f659c15de2f8ee0b7d97c20ff
  EmbeddedMusicBuzzerInstrument=https://github.com/fczuardi/buzzer-instrument.git#146f75d8b6bdc9362781eaac9ddd308fbaefc531
